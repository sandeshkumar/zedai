name: Auto Blog Post

on:
  schedule:
    - cron: "0 0 * * 1" # Monday at 00:00 UTC (5:30 AM IST)
    - cron: "0 0 * * 4" # Thursday at 00:00 UTC (5:30 AM IST)
  workflow_dispatch: {} # Manual trigger for testing

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate blog post
        run: npx tsx scripts/generate-post.ts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "ZED Labs Bot"
          git config user.email "bot@zedai.tech"
          git add content/blog/ content/topics.yaml
          git diff --staged --quiet || git commit -m "blog: auto-generate weekly post $(date +%Y-%m-%d)"
          git push
